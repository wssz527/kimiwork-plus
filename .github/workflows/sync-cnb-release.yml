name: Sync Release to CNB Mirror

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync (e.g. v1.1.5); defaults to latest published release'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sync-cnb-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  sync-cnb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sync script tests
        run: python3 scripts/test_sync_cnb_release.py
      - name: Resolve target release tag
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${EVENT_TAG:-$INPUT_TAG}"
          if [ -z "$TAG" ]; then
            TAG="$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')"
          fi
          if [ -z "$TAG" ]; then
            echo "No release tag found to sync." >&2
            exit 1
          fi
          IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
          if [ "$IS_DRAFT" = "true" ]; then
            echo "Refusing to sync draft release $TAG to CNB." >&2
            exit 1
          fi
          PRERELEASE="$(gh release view "$TAG" --json isPrerelease --jq '.isPrerelease')"
          gh release view "$TAG" --json body --jq '.body' > /tmp/release-notes.txt
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
      - name: Download GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          mkdir -p /tmp/release-assets
          gh release download "$TAG" --dir /tmp/release-assets
          ls -la /tmp/release-assets
      - name: Sync release to CNB mirror
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: wssz527/kimiwork-plus
          TAG: ${{ steps.target.outputs.tag }}
          IS_PRERELEASE: ${{ steps.target.outputs.prerelease }}
        run: |
          if [ -z "${CNB_TOKEN:-}" ]; then
            echo "CNB_TOKEN secret is not configured; skipping CNB mirror sync."
            exit 0
          fi
          extra=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            extra="--prerelease"
          fi
          python3 scripts/sync_cnb_release.py \
            --tag "$TAG" \
            --repo "$CNB_REPO" \
            --notes-file /tmp/release-notes.txt \
            $extra \
            /tmp/release-assets/*
